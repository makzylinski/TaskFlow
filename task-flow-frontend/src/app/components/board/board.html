<div class="board-toolbar">
  <button type="button" class="board-toolbar__add" (click)="modalOpen.set(true)">+ New task</button>
</div>

<div class="board" cdkDropListGroup>
  <app-column
    [title]="TaskStatus.TO_DO"
    [tasks]="todo()"
    (dropped)="drop($event, TaskStatus.TO_DO)"
  />
  <app-column
    [title]="TaskStatus.IN_PROGRESS"
    [tasks]="inProgress()"
    (dropped)="drop($event, TaskStatus.IN_PROGRESS)"
  />
  <app-column
    [title]="TaskStatus.REVIEW"
    [tasks]="review()"
    (dropped)="drop($event, TaskStatus.REVIEW)"
  />
  <app-column
    [title]="TaskStatus.DONE"
    [tasks]="done()"
    (dropped)="drop($event, TaskStatus.DONE)"
  />
</div>

@if (modalOpen()) {
  <app-task-modal [boardId]="boardId" (closed)="modalOpen.set(false)" (created)="addTask($event)" />
}
