<div class="board-toolbar">
  <button type="button" class="board-toolbar__add" (click)="modalOpen.set(true)">+ New task</button>
</div>

<div class="board" cdkDropListGroup>
  <app-column title="To do" [tasks]="todo()" (dropped)="drop($event)" />
  <app-column title="In progress" [tasks]="inProgress" (dropped)="drop($event)" />
  <app-column title="Review" [tasks]="review" (dropped)="drop($event)" />
  <app-column title="Done" [tasks]="done" (dropped)="drop($event)" />
</div>

@if (modalOpen()) {
  <app-task-modal (closed)="modalOpen.set(false)" (created)="addTask($event)" />
}
