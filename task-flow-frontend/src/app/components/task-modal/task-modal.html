<div class="backdrop" (click)="closed.emit()">
  <div
    class="modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="task-modal-title"
    (click)="$event.stopPropagation()"
  >
    <div class="modal__header">
      <h2 id="task-modal-title" class="modal__title">New task</h2>
      <button type="button" class="modal__close" aria-label="Close" (click)="closed.emit()">
        &times;
      </button>
    </div>

    <form class="modal__form" [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label for="task-name">Name</label>
        <input
          id="task-name"
          type="text"
          formControlName="name"
          placeholder="e.g. Design onboarding flow"
          autofocus
        />
        @if (form.controls.name.touched && form.controls.name.invalid) {
          <span class="field__error">Name is required</span>
        }
      </div>

      <div class="field">
        <label for="task-description">Description</label>
        <textarea
          id="task-description"
          rows="4"
          formControlName="description"
          placeholder="What needs to be done?"
        ></textarea>
      </div>

      <div class="modal__actions">
        <button type="button" class="btn btn--secondary" (click)="closed.emit()">Cancel</button>
        <button type="submit" class="btn btn--primary">Create task</button>
      </div>
    </form>
  </div>
</div>
