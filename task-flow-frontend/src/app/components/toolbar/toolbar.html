<div class="toolbar" [class.toolbar--board]="isBoardView()">
  @if (isBoardView()) {
    <nav class="toolbar__crumbs" aria-label="Breadcrumb">
      <a class="toolbar__crumb" routerLink="/dashboard">Projects /</a>
      <span class="toolbar__crumb--current">{{ boardName() }}</span>
    </nav>
  } @else {
    <div class="toolbar__title">Projects</div>
    <div class="toolbar__action">
      <div class="toolbar__action--search">
        <app-icon name="search" />
        <input
          type="text"
          placeholder="Search projects"
          aria-label="Search projects"
          (input)="onSearchChange($event)"
        />
      </div>
      <div class="toolbar__action--new">
        <button type="button" (click)="modalOpen.set(true)">
          <app-icon name="plus" [strokeWidth]="2.2" />
          New project
        </button>
      </div>
    </div>
  }
</div>

@if (modalOpen()) {
  <app-board-modal (closed)="modalOpen.set(false)" (created)="addBoard($event)" />
}
